name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node:
          - "20"
          - "24.10.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test

  quality:
    name: fallow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.10.0"
          cache: npm
      - run: npm ci
      - run: npm run fallow:audit
      - run: npm run fallow:check

  commit-convention:
    name: commit convention
    runs-on: ubuntu-24.04
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Validate the squash commit message
        shell: bash
        run: |
          set -euo pipefail
          breaking_title_pattern='^[a-z]+(\([^)]+\))?!:'
          conventional_title_pattern='^[a-z]+(\([^)]+\))?: .+'

          if [[ "$PR_TITLE" =~ $breaking_title_pattern ]]; then
            echo "Providers is pre-1.0: breaking change markers (!:) are not allowed."
            exit 1
          fi

          if ! [[ "$PR_TITLE" =~ $conventional_title_pattern ]]; then
            echo "PR title must be a Conventional Commit, for example: feat: add a provider"
            exit 1
          fi

          if printf '%s\n' "$PR_BODY" | grep -Eq '^BREAKING[ -]CHANGE'; then
            echo "Providers is pre-1.0: BREAKING CHANGE footers are not allowed."
            exit 1
          fi

  required:
    name: required
    if: ${{ always() }}
    needs:
      - test
      - quality
      - commit-convention
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation job to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          COMMIT_CONVENTION_RESULT: ${{ needs.commit-convention.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$COMMIT_CONVENTION_RESULT" = success
